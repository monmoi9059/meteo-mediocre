name: Build Signed Android APK (Terminal St-Romuald 360°)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "info terminable MArtine.html"
      - "scripts/prepare-android-assets.mjs"
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Accept Android SDK Licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Prepare Offline-Ready WebView Assets (3D Engine + Live Vessels)
        run: node scripts/prepare-android-assets.mjs --bundle-vendor

      - name: Sign & Compile Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android-app/release-signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASS || 'stromuald360' }}
          KEY_ALIAS: stromuald
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASS || 'stromuald360' }}
        run: |
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Terminal St-Romuald 360, OU=Operations Maritimes, O=Valero St-Romuald, L=Levis, ST=QC, C=CA"
          fi

          gradle -p android-app assembleRelease --no-daemon --stacktrace

          cp android-app/app/build/outputs/apk/release/app-release.apk StRomuald-Terminal-Android.apk
          ls -lh StRomuald-Terminal-Android.apk

          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs StRomuald-Terminal-Android.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StRomuald-Terminal-Android-APK
          path: StRomuald-Terminal-Android.apk
          if-no-files-found: error

      - name: Publish Signed APK to GitHub Releases (v3.0-android)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.0-android"
          NOTES=$'### 📱 Terminal St-Romuald 360° — Édition Native Android Refondue (v3.1)\n\n- **Nouveau Cockpit Tactile 3D en Bas d\'Écran (Zone Pouce, 1 Main)** : barre à 5 grands boutons (`🧭 Gyro 360`, `🎥 Vues`, `📡 Radar`, `🌡️ Météo 3D`, `🎛️ Plus`) avec tiroirs escamotables mutuellement exclusifs et vue 3D dégagée à plus de 86 %\n- **100 % Accessible à 360 px (Zéro Bouton Coupé à Droite)** : onglets `Quai 86/87`, `Marées`, `Météo`, `Carte AIS` et `🧰 Outils` (en Bottom Sheet bas d\'écran) entièrement accessibles d\'une main, tableaux défilables horizontalement et Simulateur Thermique 100 % scrollable jusqu\'en bas\n- **Gyroscope 360° Matériel 60 Hz Sans Blocage de Cardan** : barre `🎯 Calibrer` et `🧭 Relatif / Boussole` positionnée juste au-dessus du pouce\n- **Clé de signature persistante** : les prochaines mises à jour s\'installeront directement par-dessus cette version v3.1 sans désinstallation préalable'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" StRomuald-Terminal-Android.apk --clobber
            gh release edit "$TAG" --title "Terminal St-Romuald 360° — Android APK (v3.1)" --notes "$NOTES" --latest
          else
            gh release create "$TAG" StRomuald-Terminal-Android.apk \
              --title "Terminal St-Romuald 360° — Android APK (v3.1)" \
              --notes "$NOTES" \
              --latest
          fi
