name: Build Signed Android APK (Terminal St-Romuald 360°)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "info terminable MArtine.html"
      - "scripts/prepare-android-assets.mjs"
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Accept Android SDK Licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Prepare Offline-Ready WebView Assets (3D Engine + Live Vessels)
        run: node scripts/prepare-android-assets.mjs --bundle-vendor

      - name: Sign & Compile Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android-app/release-signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASS || 'stromuald360' }}
          KEY_ALIAS: stromuald
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASS || 'stromuald360' }}
        run: |
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Terminal St-Romuald 360, OU=Operations Maritimes, O=Valero St-Romuald, L=Levis, ST=QC, C=CA"
          fi

          gradle -p android-app assembleRelease --no-daemon --stacktrace

          cp android-app/app/build/outputs/apk/release/app-release.apk StRomuald-Terminal-Android.apk
          ls -lh StRomuald-Terminal-Android.apk

          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs StRomuald-Terminal-Android.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StRomuald-Terminal-Android-APK
          path: StRomuald-Terminal-Android.apk
          if-no-files-found: error

      - name: Publish Signed APK to GitHub Releases (v3.0-android)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.0-android"
          NOTES=$'### 📱 Terminal St-Romuald 360° — Édition Native Android (v3.7 — Approches du Quai 1h30 avant l\'ETA avec Remorqueurs)\n\n- **Approches du Quai Synchronisées sur 1h30 (90 min avant l\'ETA — Postes 86 & 87)** :\n  - **Démarrage automatique à `ETA - 1h30`** : la manœuvre d\'arrivée avec les remorqueurs *Océan Taiga* et *Océan K. Rusby* débute exactement 90 min avant l\'heure d\'arrivée prévue et s\'étire lentement jusqu\'à l\'accostage contre les défenses à l\'**ETA exacte**\n  - **Synchronisation Temps Réel, Curseur (-6h → +24h) & Time-Lapse** : progression verrouillée sur l\'horloge simulée (avance/recul au curseur, saut direct au milieu d\'une approche, lecture fluide Time-Lapse, puis retour progressif des remorqueurs vers le Bassin Louise après l\'accostage)\n  - **Cinématique continue sans à-coup** : 3 phases fluides (chenal → freinage/alignement → poussée latérale douce jusqu\'à `0.0 nds` à l\'ETA), bras Chiksan et aussières connectés au moment exact de l\'accostage, compteur `APPROCHE (% • -XhXX)` en temps réel dans le HUD et les pastilles Quai 86/87\n- **Moteur Atmosphérique Continu $C^1$ (`v3.6`)**, **Règles Officielles Arrivées & Départs 86 & 87 (`v3.5`)**, **Optimisation 100 % Mobile (`v3.4`)**, **Remorqueurs ETA/ETD (`v3.3`)** & **Météo 3D Physique (`v3.2`)** + signature persistante (mise à jour directe)'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" StRomuald-Terminal-Android.apk --clobber
            gh release edit "$TAG" --title "Terminal St-Romuald 360° — Android APK (v3.7)" --notes "$NOTES" --latest
          else
            gh release create "$TAG" StRomuald-Terminal-Android.apk \
              --title "Terminal St-Romuald 360° — Android APK (v3.7)" \
              --notes "$NOTES" \
              --latest
          fi
