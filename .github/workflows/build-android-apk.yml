name: Build Signed Android APK (Terminal St-Romuald 360°)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "info terminable MArtine.html"
      - "scripts/prepare-android-assets.mjs"
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Accept Android SDK Licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Prepare Offline-Ready WebView Assets (3D Engine + Live Vessels)
        run: node scripts/prepare-android-assets.mjs --bundle-vendor

      - name: Sign & Compile Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android-app/release-signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASS || 'stromuald360' }}
          KEY_ALIAS: stromuald
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASS || 'stromuald360' }}
        run: |
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Terminal St-Romuald 360, OU=Operations Maritimes, O=Valero St-Romuald, L=Levis, ST=QC, C=CA"
          fi

          gradle -p android-app assembleRelease --no-daemon --stacktrace

          cp android-app/app/build/outputs/apk/release/app-release.apk StRomuald-Terminal-Android.apk
          ls -lh StRomuald-Terminal-Android.apk

          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs StRomuald-Terminal-Android.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StRomuald-Terminal-Android-APK
          path: StRomuald-Terminal-Android.apk
          if-no-files-found: error

      - name: Publish Signed APK to GitHub Releases (v3.0-android)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.0-android"
          NOTES=$'### 📱 Terminal St-Romuald 360° — Édition Native Android (v3.6 — Transitions Atmosphériques Continues Jour / Aube / Crépuscule / Nuit)\n\n- **Moteur Atmosphérique Continu $C^1$ (Aube, Jour, Crépuscule & Nuit — 2D & 3D)** :\n  - **Interpolation continue selon l\'altitude solaire réelle (`-15°` → `+15°+`)** : suppression totale des sauts brusques de couleur entre Nuit, Heure bleue, Lever/Coucher et Plein jour\n  - **Lueur crépusculaire directionnelle azimutale GLSL + Ceinture de Vénus** : halo ambré/cuivré localisé vers l\'azimut réel du soleil, ombre de la Terre et arche rosée subtile à l\'opposé, fusionnés sans couture avec la brume fluviale de Koschmieder\n  - **Atténuation physique sous couvert nuageux / brouillard** : aubes et crépuscules gris-argent maritime réalistes par temps couvert (zéro ciel orange artificiel sous OVC) + cubemap PBR dynamique continue sur le fleuve\n  - **Relais continu Lune ↔ Soleil, étoiles, nuages et éclairage architectural** sans discontinuité d\'ombre ni de teinte\n- **Logique Officielle Arrivées & Départs 86 & 87 (`v3.5`)**, **Optimisation 100 % Mobile (`v3.4`)**, **Remorqueurs ETA/ETD (`v3.3`)** & **Météo 3D Physique (`v3.2`)** + signature persistante (mise à jour directe)'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" StRomuald-Terminal-Android.apk --clobber
            gh release edit "$TAG" --title "Terminal St-Romuald 360° — Android APK (v3.6)" --notes "$NOTES" --latest
          else
            gh release create "$TAG" StRomuald-Terminal-Android.apk \
              --title "Terminal St-Romuald 360° — Android APK (v3.6)" \
              --notes "$NOTES" \
              --latest
          fi
