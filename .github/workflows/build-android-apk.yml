name: Build Signed Android APK (Terminal St-Romuald 360°)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "info terminable MArtine.html"
      - "scripts/prepare-android-assets.mjs"
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Accept Android SDK Licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Prepare Offline-Ready WebView Assets (3D Engine + Live Vessels)
        run: node scripts/prepare-android-assets.mjs --bundle-vendor

      - name: Sign & Compile Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android-app/release-signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASS || 'stromuald360' }}
          KEY_ALIAS: stromuald
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASS || 'stromuald360' }}
        run: |
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Terminal St-Romuald 360, OU=Operations Maritimes, O=Valero St-Romuald, L=Levis, ST=QC, C=CA"
          fi

          gradle -p android-app assembleRelease --no-daemon --stacktrace

          cp android-app/app/build/outputs/apk/release/app-release.apk StRomuald-Terminal-Android.apk
          ls -lh StRomuald-Terminal-Android.apk

          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs StRomuald-Terminal-Android.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StRomuald-Terminal-Android-APK
          path: StRomuald-Terminal-Android.apk
          if-no-files-found: error

      - name: Publish Signed APK to GitHub Releases (v3.0-android)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.0-android"
          NOTES=$'### 📱 Terminal St-Romuald 360° — Édition Native Android (v3.5 — Règles Officielles Arrivées & Départs 86 & 87)\n\n- **Logique Officielle des Arrivées & Départs (Sections 86 & 87 — Lauzon #03250)** :\n  - **Section 86 (`< 25 000 t DWT`, Réf. Caisson #5)** : Arrivée & Départ *(détaché)* de **PM + 1h30** à **BM + 1h00**\n  - **Section 86 (`> 25 000 t DWT`, Émissaire 9,7 m • UKC 0,5 m)** : Arrivée & Départ de **PM + 1h30** à **BM - 30 min**\n  - **Section 87 (`≤ 40 000 t DWT`)** : Arrivée **Bâbord à quai sur marée descendante (Jusant)** / **Tribord à quai sur marée montante (Flot)** • Départ **Aucune restriction**\n  - **Section 87 (`> 40 000 t DWT`)** : Arrivée de **PM + 1h30** à **BM - 30 min** *(TE max 15,5 m)* • Départ **Aucune restriction si TE < 13 m** / **PM + 1h00 à BM - 1h00 si TE ≥ 13 m**\n  - **Conformité Marée Temps Réel sur les Escales Port de Québec (ETA/ETD)**, filtre rapide `Arr. & Dép. / Arrivées / Départs` et hydratation instantanée `0 ms` des marées Lauzon\n- **Optimisation Tactile 100 % Mobile (`v3.4`)**, **Manœuvres Remorqueurs Automatiques aux ETA/ETD (`v3.3`)** & **Météo 3D Physique (`v3.2`)** + clé de signature persistante (mise à jour directe par-dessus `v3.0`–`v3.4`)'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" StRomuald-Terminal-Android.apk --clobber
            gh release edit "$TAG" --title "Terminal St-Romuald 360° — Android APK (v3.5)" --notes "$NOTES" --latest
          else
            gh release create "$TAG" StRomuald-Terminal-Android.apk \
              --title "Terminal St-Romuald 360° — Android APK (v3.5)" \
              --notes "$NOTES" \
              --latest
          fi
