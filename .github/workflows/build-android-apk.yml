name: Build Signed Android APK (Terminal St-Romuald 360°)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "info terminable MArtine.html"
      - "scripts/prepare-android-assets.mjs"
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Accept Android SDK Licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Prepare Offline-Ready WebView Assets (3D Engine + Live Vessels)
        run: node scripts/prepare-android-assets.mjs --bundle-vendor

      - name: Sign & Compile Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android-app/release-signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASS || 'stromuald360' }}
          KEY_ALIAS: stromuald
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASS || 'stromuald360' }}
        run: |
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Terminal St-Romuald 360, OU=Operations Maritimes, O=Valero St-Romuald, L=Levis, ST=QC, C=CA"
          fi

          gradle -p android-app assembleRelease --no-daemon --stacktrace

          cp android-app/app/build/outputs/apk/release/app-release.apk StRomuald-Terminal-Android.apk
          ls -lh StRomuald-Terminal-Android.apk

          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs StRomuald-Terminal-Android.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StRomuald-Terminal-Android-APK
          path: StRomuald-Terminal-Android.apk
          if-no-files-found: error

      - name: Publish Signed APK to GitHub Releases (v3.0-android)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.0-android"
          NOTES=$'### 📱 Terminal St-Romuald 360° — Édition Native Android (v3.3 — Manœuvres Remorqueurs Automatiques ETA/ETD)\n\n- **Accostages & Appareillages 3D Automatiques aux ETA / ETD (Sections 86 & 87)** :\n  - **Déclenchement Chronologique Temps Réel & Time-Scrubber (`-6h..+24h`)** : dès que l\'**ETA** ou l\'**ETD** d\'un navire est atteinte (horloge temps réel à la seconde près, glissement du curseur temporel, Time-Lapse accéléré ou saisie manuelle d\'une ETD opérateur), l\'escorte complète des remorqueurs Groupe Océan (`Océan Taiga` & `Océan K. Rusby`) se lance automatiquement dans l\'Aperçu 3D\n  - **Support Intégral Bi-Quai (Postes 86 & 87)** : trajectoires hydrodynamiques sans collision avec le quai en T Valero ni le Caisson #1, aussières caténaires à 11 points, amarrage/largage indépendant des bras de chargement Chiksan et des coupées, file d\'attente multi-navires (rotation départ -> arrivée) et affichage temps réel sur le radar 3D et les badges `#ops-card`\n- **Synchronisation Météo Réelle 100 % Physique dans l\'Aperçu 3D (`v3.2`)** : éphémérides `America/Toronto`, occultation nuageuse multi-couches, visibilité de Koschmieder étalonnée, microphysique OMM et manche à air ISGOTT\n- **Cockpit Tactile 3D Zone Pouce (`360 px`) & Gyroscope 360° Matériel 60 Hz** + clé de signature persistante (mise à jour directe par-dessus `v3.0`–`v3.2`)'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" StRomuald-Terminal-Android.apk --clobber
            gh release edit "$TAG" --title "Terminal St-Romuald 360° — Android APK (v3.3)" --notes "$NOTES" --latest
          else
            gh release create "$TAG" StRomuald-Terminal-Android.apk \
              --title "Terminal St-Romuald 360° — Android APK (v3.3)" \
              --notes "$NOTES" \
              --latest
          fi
