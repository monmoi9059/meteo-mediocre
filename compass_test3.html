<!DOCTYPE html>
<html>
<head>
<style>
    body { background: #333; }
    #compass-container {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.5);
        background: rgba(0,0,0,0.3);
    }
    .compass-labels span { position: absolute; transform: translate(-50%, -50%); color: white;}
    .compass-labels .n { top: 10%; left: 50%; color: #ff4444; }
    .compass-labels .e { top: 50%; left: 90%; }
    .compass-labels .s { top: 90%; left: 50%; }
    .compass-labels .w { top: 50%; left: 10%; }

    #compass-arrow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 4px;
        height: 45%;
        background-color: #ff4444;
        transform-origin: top center;
        border-radius: 2px;
    }
    #compass-arrow::after {
        content: '';
        position: absolute;
        top: 100%;
        left: 0;
        width: 4px;
        height: 100%;
        background-color: white;
        border-radius: 2px;
    }
</style>
</head>
<body>
    <div id="compass-container">
        <div class="compass-labels">
            <span class="n">N</span>
            <span class="e">E</span>
            <span class="s">S</span>
            <span class="w">W</span>
        </div>
        <div id="compass-arrow" style="transform: translate(-50%, -50%) rotate(45deg);"></div>
    </div>
</body>
</html>
