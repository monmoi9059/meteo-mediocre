<!DOCTYPE html>
<html>
<head>
<style>
    body { background: #333; }
    #compass-container {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.5);
        background: rgba(0,0,0,0.3);
    }
    .compass-labels span { position: absolute; transform: translate(-50%, -50%); color: white;}
    .compass-labels .n { top: 10%; left: 50%; color: #ff4444; }
    #compass-arrow {
        position: absolute;
        bottom: 50%;
        left: 50%;
        width: 4px;
        height: 45%;
        background-color: #ff4444;
        transform-origin: bottom center;
        border-radius: 2px;
    }
</style>
</head>
<body>
    <div id="compass-container">
        <div class="compass-labels"><span class="n">N</span></div>
        <div id="compass-arrow" style="transform: translate(-50%, -100%) rotate(45deg);"></div>
    </div>
</body>
</html>
